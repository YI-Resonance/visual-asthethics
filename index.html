<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>近體詩動態美學實驗 - 網路解鎖版</title>
    
    <!-- 💡 使用最新、相容性最高的 html2canvas 版本 -->
    <script src="https://cloudflare.com"></script>

    <style>
        /* 💡 1. 內嵌式字型宣告：徹底解決畫布被污染而無法導出的問題 */
        @font-face {
            font-family: 'MyCustomPoetryFont'; 
            /* 👇 請將您轉換出來的那段超長 Base64 文字，精確地貼在下面的 url() 括號內 */
            src: url('data:font/truetype;charset=utf-8;base64,這裡貼上您轉換出來的超長Base64文字') format('truetype'); 
            font-weight: normal;
            font-style: normal;
        }

        /* 2. 全域與畫布設定 */
        body {
            background-color: #f7f5f0; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 導出範圍包裝盒 */
        .export-wrapper {
            background-color: transparent; 
            padding: 40px; /* 加大留白，確保高斯模糊羽化光暈在導出時不會被邊緣切斷 */
            display: inline-block;
        }

        /* 3. 核心控制：字體大小、扁平度與連動比例 */
        .char-container {
            font-size: 100px; 
            transform: scaleX(0.85); /* 保持您心儀的扁平收窄比例 */
            transform-origin: center;
            font-family: 'MyCustomPoetryFont', "PingFang TC", serif;
            font-weight: bold;
            position: relative;
            width: 1.4em;
            height: 1.4em;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 4. 最下層：紅色的羽化底色層（墨暈效果） */
        .feather-background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: 1.1em;
            height: 1.1em;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(186, 45, 50, 0.7) 0%, rgba(186, 45, 50, 0.3) 40%, rgba(186, 45, 50, 0) 70%);
            filter: blur(0.08em); 
        }

        /* 5. 中間層：您的自訂 SVG 外框層 */
        .svg-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; 
            height: 85%;
            z-index: 2;
            pointer-events: none;
        }

        /* 6. 最上層：純文字層 */
        .text-layer {
            position: relative;
            z-index: 3;
            color: #1a1a1a; 
            line-height: 1;
        }

        /* 7. 按鈕樣式 */
        .btn-export {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            background-color: #ba2d32; 
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="poetry-artpiece" class="export-wrapper">
        <div class="char-container">
            <div class="feather-background"></div>
            <svg class="svg-frame" viewBox="215 117 426 323" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://w3.org">
                <rect x="215.368" y="117.355" opacity="0.5" fill="none" stroke="#009640" stroke-width="1.5" stroke-miterlimit="10" width="425.924" height="322.077" vector-effect="non-scaling-stroke"/>
            </svg>
            <div class="text-layer">角</div>
        </div>
    </div>

    <button class="btn-export" onclick="exportTransparentPNG()">匯出透明 PNG</button>

    <script>
        function exportTransparentPNG() {
            const target = document.getElementById('poetry-artpiece');
            
            // 💡 針對網路環境進行最嚴格的渲染參數設定
            html2canvas(target, {
                backgroundColor: null, // 完美透明底
                scale: 3,              // 3倍印刷級超高清解析度
                logging: false,
                useCORS: false,        // 💡 既然字型已經內嵌，關閉 CORS 檢查可以大幅提升本機與網路環境的相容性
                allowTaint: true       // 允許渲染被標記的畫布
            }).then(canvas => {
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = '近體詩作品_透明底.png';
                link.href = image;
                link.click();
            });
        }
    </script>

</body>
</html>
