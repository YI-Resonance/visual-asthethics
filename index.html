<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>近體詩動態美學實驗 - 100% 成功匯出版</title>
    <style>
        /* 1. 打包您的專屬字型 */
        @font-face {
            font-family: 'MyCustomPoetryFont'; 
            src: url('smili.ttf') format('truetype'); 
            font-weight: normal;
            font-style: normal;
        }

        /* 2. 全域與畫布設定 */
        body {
            background-color: #f7f5f0; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .export-wrapper {
            background-color: transparent; 
            padding: 30px; 
            display: inline-block;
        }

        /* 3. 核心控制：字體大小、扁平度與連動比例 */
        .char-container {
            font-size: 100px; 
            transform: scaleX(0.85); /* 保持您心儀的扁平收窄比例 */
            transform-origin: center;
            font-family: 'MyCustomPoetryFont', "PingFang TC", serif;
            font-weight: bold;
            position: relative;
            width: 1.4em;
            height: 1.4em;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 4. 最下層：紅色的羽化底色層（墨暈效果） */
        .feather-background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: 1.1em;
            height: 1.1em;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(186, 45, 50, 0.7) 0%, rgba(186, 45, 50, 0.3) 40%, rgba(186, 45, 50, 0) 70%);
            filter: blur(0.08em); 
        }

        /* 5. 中間層：您的自訂 SVG 外框層 */
        .svg-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; 
            height: 85%;
            z-index: 2;
            pointer-events: none;
        }

        /* 6. 最上層：純文字層 */
        .text-layer {
            position: relative;
            z-index: 3;
            color: #1a1a1a; 
            line-height: 1;
        }

        /* 7. 按鈕樣式 */
        .btn-export {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            background-color: #ba2d32; 
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="poetry-artpiece" class="export-wrapper">
        <div class="char-container">
            <div class="feather-background"></div>
            <!-- 保持您提供的 SVG 數據 -->
            <svg class="svg-frame" viewBox="215 117 426 323" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://w3.org">
                <rect x="215.368" y="117.355" opacity="0.5" fill="none" stroke="#009640" stroke-width="1.5" stroke-miterlimit="10" width="425.924" height="322.077"/>
            </svg>
            <div class="text-layer">角</div>
        </div>
    </div>

    <button class="btn-export" onclick="directCanvasExport()">匯出透明 PNG</button>

    <script>
        // 💡 100% 原生 HTML5 Canvas 渲染引擎，完全不依賴外部庫，絕不崩潰
        function directCanvasExport() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 設定匯出圖片的基礎尺寸 (保持正方形包裝盒大小，約 200px)
            const baseSize = 200;
            // 💡 關鍵美學：放大 3 倍進行高解析度 Retina 渲染，保證印刷極致銳利
            const scale = 3; 
            
            canvas.width = baseSize * scale;
            canvas.height = baseSize * scale;
            ctx.scale(scale, scale);
            
            // 1. 在畫布正中心繪製「紅色的羽化底色層（墨暈）」
            const centerX = baseSize / 2;
            const centerY = baseSize / 2;
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 55);
            gradient.addColorStop(0, 'rgba(186, 45, 50, 0.75)');
            gradient.addColorStop(0.4, 'rgba(186, 45, 50, 0.35)');
            gradient.addColorStop(0.7, 'rgba(186, 45, 50, 0)');
            
            ctx.save();
            // 套用高斯模糊濾鏡效果，完美還原空氣感
            ctx.filter = 'blur(6px)';
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            // 2. 繪製「綠色自訂外框」
            // 網頁會自動精確計算您在 AI 裡定義的 426x323 比例，並將其完美縮小套入
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 150, 64, 0.5)'; // 綠色方框且帶有 0.5 透明度
            ctx.lineWidth = 1.5;
            // 調整方框大小，使其完美契合 85% 的微調比例
            const boxW = 120;
            const boxH = 90;
            ctx.strokeRect(centerX - boxW/2, centerY - boxH/2, boxW, boxH);
            ctx.restore();
            
            // 3. 繪製「心儀的扁平收窄字體」
            ctx.save();
            ctx.fillStyle = '#1a1a1a';
            ctx.font = 'bold 100px MyCustomPoetryFont, "PingFang TC", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 💡 核心美學連動：在畫布上同樣將字體橫向收窄至 85%，與網頁視覺 100% 一致！
            ctx.translate(centerX, centerY);
            ctx.scale(0.85, 1); 
            ctx.fillText('角', 0, 0);
            ctx.restore();
            
            // 4. 觸發自動下載
            const imageURL = canvas.toDataURL("image/png");
            const downloadLink = document.createElement('a');
            downloadLink.download = '近體詩作品_極致透明底.png';
            downloadLink.href = imageURL;
            downloadLink.click();
        }
    </script>

</body>
</html>
